<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saetia · Saint Vitus · 10.30.26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111;
    --ground: #FAE3E2;
    --panel: #1a1918;
    --panel-ink: #EDEBE4;
    --panel-dim: #9a968c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #2a2827;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 24px;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* The poster: 595 × 842, everything sized in container units so it stays sharp at any size. 1px on the A4 artboard = 100/595 cqw. */
  .poster {
    position: relative;
    width: min(calc((100vh - 48px) * 595 / 842), calc(100vw - 48px - 320px - 32px));
    aspect-ratio: 595 / 842;
    background: var(--ground);
    overflow: hidden;
    container-type: inline-size;
    box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 24px 64px rgba(0,0,0,.35);
  }
  .wordmark {
    position: absolute;
    left: calc(30 * 100cqw / 595);
    top: calc(340 * 100cqw / 595);
    width: calc(141 * 100cqw / 595);
    height: auto;
  }
  .details {
    position: absolute;
    left: calc(20 * 100cqw / 595);
    width: calc(340 * 100cqw / 595);
    margin: 0;
    font-family: 'Instrument Serif', serif;
    font-size: calc(14 * 100cqw / 595);
    line-height: calc(20 * 100cqw / 595);
    color: var(--ink);
  }
  .venue { top: calc(717 * 100cqw / 595); }
  .date  { top: calc(773 * 100cqw / 595); }
  /* Paper's Halftone Dots layer sits on top at 24% opacity, over its own bone ground */
  .texture {
    position: absolute;
    inset: 0;
    background: #F2F1E8;
    opacity: .24;
    pointer-events: none;
  }

  /* Controls */
  .panel {
    width: 320px;
    flex-shrink: 0;
    max-height: calc(100vh - 48px);
    overflow: auto;
    background: var(--panel);
    color: var(--panel-ink);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06);
  }
  .panel h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .panel h2 { font-size: 12px; font-weight: 500; margin: 8px 0 0; color: var(--panel-dim); text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .row label { display: flex; justify-content: space-between; font-size: 13px; }
  .row output { font-variant-numeric: tabular-nums; color: var(--panel-dim); }
  input[type=range] { width: 100%; accent-color: #E93A2D; }
  .buttons { display: flex; gap: 8px; }
  button {
    flex: 1;
    font: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 0;
    background: #2e2c2a;
    color: var(--panel-ink);
    cursor: pointer;
    transition: transform 120ms ease-out, background-color 120ms ease-out;
  }
  button:hover { background: #3a3734; }
  button:active { transform: scale(.97); }
  .swatches { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1;
    padding: 0;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 0 0 2px #E93A2D; }
  .versions { display: flex; flex-direction: column; gap: 6px; }
  .version { display: flex; gap: 6px; }
  .version button { text-align: left; }
  .version button[aria-pressed="true"] { box-shadow: 0 0 0 1px #E93A2D; }
  .version .remove { flex: 0 0 32px; text-align: center; color: var(--panel-dim); }
  .hint { font-size: 12px; line-height: 17px; color: var(--panel-dim); margin: 0; }

  /* Embedded on the site (a 720 × 540 frame): keep the poster and the sliders side by side */
  @media (max-width: 820px) and (min-width: 561px) {
    body { padding: 16px; gap: 16px; }
    .poster { width: min(calc((100vh - 32px) * 595 / 842), calc(100vw - 32px - 280px - 16px)); }
    .panel { width: 280px; max-height: calc(100vh - 32px); padding: 16px; }
  }
  @media (max-width: 560px) {
    body { flex-direction: column; height: auto; }
    .poster { width: min(100%, 595px); }
    .panel { width: 100%; max-height: none; }
  }
  /* ?poster: just the poster, live, with arrows to step through the grounds (the case study's last piece) */
  .cycle { display: none; }
  body.poster-only { background: #F4F4F4; flex-direction: column; gap: 16px; padding: 24px; }
  body.poster-only .panel { display: none; }
  body.poster-only .poster {
    width: calc((100vh - 48px - 16px - 36px) * 595 / 842);
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 16px 40px -16px rgba(0,0,0,.28);
    transition: background-color 400ms ease;
  }
  body.poster-only .cycle { display: flex; align-items: center; gap: 12px; height: 36px; }
  .cycle .arrow {
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: #fff; color: #181818; box-shadow: 0 0 0 1px #EBEBEB;
    display: grid; place-items: center; cursor: pointer;
    transition: transform 160ms ease-out, box-shadow 160ms ease;
  }
  .cycle .arrow:active { transform: scale(0.95); }
  @media (hover: hover) and (pointer: fine) { .cycle .arrow:hover { box-shadow: 0 0 0 1px #d6d6d6; } }
  .cycle .arrow:focus-visible { outline: 2px solid #181818; outline-offset: 2px; }
  .cycle .name { min-width: 104px; text-align: center; font-size: 13px; line-height: 20px; color: #666; }
</style>
</head>
<body>

<main class="poster" aria-label="Saetia at Saint Vitus, 10.30.26, 6 PM">
  <img class="wordmark" src="assets/saetia.svg" alt="SAETIA">
  <p class="details venue">Saint Vitus,<br>428 Troutman Street, Brooklyn, NY 11237</p>
  <p class="details date">10.30.26<br>6 PM</p>
  <div class="texture" id="texture"></div>
</main>

<aside class="panel">
  <h1>Saetia · moving halftone</h1>

  <h2>Motion</h2>
  <div class="row"><label for="speed">Speed <output id="speed-v"></output></label><input id="speed" type="range" min="0" max="3" step="0.01" value="0.6"></div>
  <div class="row"><label for="flow">Flow (how far the blobs travel) <output id="flow-v"></output></label><input id="flow" type="range" min="0" max="0.3" step="0.001" value="0.06"></div>
  <div class="row"><label for="flowScale">Flow size <output id="flowScale-v"></output></label><input id="flowScale" type="range" min="0.5" max="10" step="0.1" value="2.5"></div>
  <div class="row"><label for="breathe">Breathe (dots swell) <output id="breathe-v"></output></label><input id="breathe" type="range" min="0" max="0.5" step="0.01" value="0.08"></div>
  <div class="row"><label for="drift">Drift (slow pan) <output id="drift-v"></output></label><input id="drift" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="row"><label for="sizeSwing">Size swing (how far size moves) <output id="sizeSwing-v"></output></label><input id="sizeSwing" type="range" min="0" max="0.4" step="0.01" value="0"></div>
  <div class="row"><label for="sizeSpeed">Size speed <output id="sizeSpeed-v"></output></label><input id="sizeSpeed" type="range" min="0" max="2" step="0.01" value="0.35"></div>

  <h2>Texture</h2>
  <div class="row"><label for="contrast">Contrast <output id="contrast-v"></output></label><input id="contrast" type="range" min="0" max="1" step="0.01" value="0.89"></div>
  <div class="row"><label for="radius">Radius <output id="radius-v"></output></label><input id="radius" type="range" min="0" max="2" step="0.01" value="0.72"></div>
  <div class="row"><label for="size">Size <output id="size-v"></output></label><input id="size" type="range" min="0" max="1" step="0.01" value="0.88"></div>
  <div class="row"><label for="opacity">Opacity <output id="opacity-v"></output></label><input id="opacity" type="range" min="0" max="1" step="0.01" value="0.24"></div>

  <h2>Ground</h2>
  <div class="swatches" id="swatches"></div>

  <h2>Versions</h2>
  <div class="versions" id="versions"></div>
  <button id="save" type="button">Save this version</button>

  <div class="buttons">
    <button id="play" type="button">Pause</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <p class="hint">Same shader as the Paper board (Halftone Dots, gooey, hex grid), with the sampled image pushed around by slowly moving noise.</p>
</aside>

<script type="module">
  import {
    ShaderMount,
    halftoneDotsFragmentShader,
    getShaderColorFromString,
  } from '/posters/saetia/vendor/shaders/index.js';

  // Paper's shader, plus a time-driven warp on where each dot samples the image.
  const motion = `
uniform float u_time;
uniform float u_flow;
uniform float u_flowScale;
uniform float u_breathe;
uniform float u_drift;
uniform float u_sizeSwing;
uniform float u_sizeFreq;
uniform float u_breatheFreq;
uniform float u_loop;   // loop length in shader seconds; 0 = runs forever without repeating
uniform float u_ease;   // in a loop: 0 = constant drift, 1 = drift comes to rest at the start/end of each loop

// oscillation that starts at rest (lowest point, zero velocity) rather than mid-swing
float swing(float t, float f) { return -cos(t * f); }

float flowNoise(vec2 p) {
  float n = 0.;
  float a = .5;
  for (int i = 0; i < 3; i++) {
    n += a * valueNoise(p);
    p *= 2.03;
    a *= .5;
  }
  return n;
}

vec2 flowWarp(vec2 uv) {
  vec2 p = uv * u_flowScale;
  vec2 o1;
  vec2 o2;
  if (u_loop > 0.) {
    // travel round a circle through the noise at the same speed, so the last frame meets the first
    float u = u_time / u_loop;
    // ease: slow at the start and end of the loop, faster in the middle (same distance overall)
    u -= u_ease * sin(6.2831853 * u) / 6.2831853;
    float a = 6.2831853 * u;
    float r = .25 * u_loop / 6.2831853;
    o1 = r * vec2(cos(a), sin(a));
    o2 = r * vec2(sin(a + 1.3), cos(a + 1.3));
  } else {
    float t = u_time * .25;
    o1 = vec2(0., t);
    o2 = vec2(0., -t);
  }
  vec2 w = vec2(
    flowNoise(p + o1),
    flowNoise(p + vec2(5.2, 0.) + o2 + 1.7)
  ) - .4375;
  return uv + u_flow * w + vec2(u_drift * .02 * u_time, 0.);
}
`;

  let frag = halftoneDotsFragmentShader;
  // declare our helpers after valueNoise exists
  frag = frag.replace('float lst(float edge0', motion + '\nfloat lst(float edge0');
  // warp the sampling point for both luminance and colour
  frag = frag.replace(
    'float outOfFrame = getUvFrame(samplingUV, pad * stepSize);',
    'samplingUV = flowWarp(samplingUV);\n  float outOfFrame = getUvFrame(samplingUV, pad * stepSize);'
  );
  // let the dot radius breathe a little over time
  frag = frag.replace(
    'float baseRadius = u_radius;',
    'float baseRadius = u_radius * (1. + u_breathe * swing(u_time, u_breatheFreq));'
  );
  // animate the grid size: swings around the Size slider, on its own clock
  frag = frag.replace(
    'float cellsPerSide = mix(300., 7., pow(u_size, .7));',
    'float animSize = clamp(u_size + u_sizeSwing * swing(u_time, u_sizeFreq), 0., 1.);\n  float cellsPerSide = mix(300., 7., pow(animSize, .7));'
  );
  if (!frag.includes('flowWarp(samplingUV)') || !frag.includes('animSize')) console.warn('Shader patch did not apply; check the shader version.');

  const $ = (id) => document.getElementById(id);
  const defaults = {};
  const sliders = ['speed', 'flow', 'flowScale', 'breathe', 'drift', 'sizeSwing', 'sizeSpeed', 'contrast', 'radius', 'size', 'opacity'];
  sliders.forEach((k) => (defaults[k] = $(k).value));

  const image = new Image();
  image.src = '/posters/saetia/halftone-source.webp';
  await image.decode();

  // Seamless-loop mode (used for recording): everything repeats every `loop` shader-seconds,
  // so oscillations are rounded to a whole number of cycles per loop.
  let loop = 0;
  let ease = 0;
  const loopFreq = (f) => {
    if (!loop) return f;
    const cycles = Math.max(1, Math.round((f * loop) / (2 * Math.PI)));
    return (cycles * 2 * Math.PI) / loop;
  };

  const uniforms = () => ({
    u_image: image,
    u_imageAspectRatio: image.naturalWidth / image.naturalHeight,
    u_colorFront: getShaderColorFromString('#2B2B2B'),
    u_colorBack: [0, 0, 0, 0],
    u_originalColors: true,
    u_inverted: false,
    u_grid: 1,          // hex
    u_type: 1,          // gooey
    u_size: +$('size').value,
    u_radius: +$('radius').value,
    u_contrast: +$('contrast').value,
    u_grainMixer: 0.2,
    u_grainOverlay: 0.96,
    u_grainSize: 0.5,
    u_flow: +$('flow').value,
    u_flowScale: +$('flowScale').value,
    u_breathe: +$('breathe').value,
    u_drift: +$('drift').value,
    u_sizeSwing: +$('sizeSwing').value,
    u_sizeFreq: loopFreq(+$('sizeSpeed').value),
    u_breatheFreq: loopFreq(0.9),
    u_loop: loop,
    u_ease: ease,
    // sizing: cover the poster, centred
    u_fit: 2, u_scale: 1, u_rotation: 0,
    u_originX: .5, u_originY: .5, u_offsetX: 0, u_offsetY: 0,
    u_worldWidth: 0, u_worldHeight: 0,
  });

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduceMotion;
  const mount = new ShaderMount($('texture'), frag, uniforms(), undefined, playing ? +$('speed').value : 0);

  const show = () => {
    sliders.forEach((k) => ($(k + '-v').textContent = (+$(k).value).toFixed(k === 'flow' ? 3 : 2)));
    $('texture').style.opacity = $('opacity').value;
    $('play').textContent = playing ? 'Pause' : 'Play';
  };

  sliders.forEach((k) =>
    $(k).addEventListener('input', () => {
      if (k === 'speed') { if (playing) mount.setSpeed(+$('speed').value); }
      else if (k !== 'opacity') mount.setUniforms(uniforms());
      show();
    })
  );

  $('play').addEventListener('click', () => {
    playing = !playing;
    mount.setSpeed(playing ? +$('speed').value : 0);
    show();
  });

  $('reset').addEventListener('click', () => {
    sliders.forEach((k) => ($(k).value = defaults[k]));
    mount.setUniforms(uniforms());
    if (playing) mount.setSpeed(+$('speed').value);
    show();
  });

  // The 20 grounds from the Paper colour study. Dark grounds switch the ink to bone.
  const grounds = [
    ['Bone', '#F2F1E8'], ['Pink', '#FAE3E2'], ['Blush', '#E8C4C0'], ['Sand', '#E6D3B3'], ['Butter', '#EFE2A8'],
    ['Sage', '#B9BFA8'], ['Pale blue', '#C9D3D6'], ['Lilac', '#CFC4D6'], ['Putty', '#CBC3B4'], ['Clay', '#C98F72'],
    ['Terracotta', '#B5553C', 1], ['Red', '#D9381F'], ['Oxblood', '#4A1512', 1], ['Olive', '#5E5C3E', 1], ['Moss', '#3E4A32', 1],
    ['Slate', '#2F3A44', 1], ['Navy', '#1F2A3D', 1], ['Aubergine', '#3A2234', 1], ['Charcoal', '#2A2826', 1], ['Black', '#141312', 1],
  ];
  const poster = document.querySelector('.poster');
  const wordmark = document.querySelector('.wordmark');
  let ground = '#FAE3E2';
  const pick = (hex) => {
    const [, , dark] = grounds.find((g) => g[1] === hex) || [];
    ground = hex;
    document.querySelectorAll('.swatch').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.hex === hex)));
    poster.style.setProperty('--ground', hex);
    poster.style.setProperty('--ink', dark ? '#F2F1E8' : '#111111');
    // the wordmark is an <img>, so invert it to bone on dark grounds
    wordmark.style.filter = dark ? 'invert(1) sepia(.08) brightness(.95)' : '';
  };
  grounds.forEach(([name, hex]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.dataset.hex = hex;
    b.title = `${name} ${hex}`;
    b.setAttribute('aria-label', name);
    b.style.background = hex;
    b.addEventListener('click', () => { pick(hex); markVersion(null); });
    $('swatches').append(b);
  });

  // ---- Versions: saved slider + ground settings ----
  // Built-in versions live in the code; ones you save live in this browser (localStorage).
  const builtIn = [
    {
      name: 'Aubergine · big radius',
      ground: '#3A2234',
      speed: 0.81, flow: 0.109, flowScale: 2.5, breathe: 0.08, drift: 0,
      sizeSwing: 0, sizeSpeed: 0.35,
      contrast: 0.87, radius: 1.97, size: 0.56, opacity: 0.24,
    },
    {
      name: 'Aubergine · big radius · size moving',
      ground: '#3A2234',
      speed: 0.68, flow: 0.109, flowScale: 2.5, breathe: 0.08, drift: 0,
      sizeSwing: 0.14, sizeSpeed: 0.35,
      contrast: 0.87, radius: 1.97, size: 0.56, opacity: 0.24,
    },
    {
      // the site opens on this: the same look, moving slower, the grid barely swinging
      name: 'Aubergine · slow',
      ground: '#3A2234',
      speed: 0.25, flow: 0.109, flowScale: 2.5, breathe: 0.08, drift: 0,
      sizeSwing: 0.04, sizeSpeed: 0.15,
      contrast: 0.87, radius: 1.97, size: 0.56, opacity: 0.24,
    },
  ];
  const STORE = 'saetia-poster-versions';
  const saved = () => JSON.parse(localStorage.getItem(STORE) || '[]');
  const current = () => Object.fromEntries([['ground', ground], ...sliders.map((k) => [k, +$(k).value])]);

  let activeVersion = null;
  const markVersion = (name) => {
    activeVersion = name;
    document.querySelectorAll('.version .load').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.name === name)));
  };

  const apply = (v) => {
    sliders.forEach((k) => { if (k in v) $(k).value = v[k]; });
    pick(v.ground || ground);
    mount.setUniforms(uniforms());
    mount.setSpeed(playing ? +$('speed').value : 0);
    show();
    markVersion(v.name);
  };

  const renderVersions = () => {
    $('versions').replaceChildren();
    const add = (v, removable) => {
      const row = document.createElement('div');
      row.className = 'version';
      const load = document.createElement('button');
      load.type = 'button';
      load.className = 'load';
      load.dataset.name = v.name;
      load.textContent = v.name;
      load.addEventListener('click', () => apply(v));
      row.append(load);
      if (removable) {
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'remove';
        rm.setAttribute('aria-label', `Delete ${v.name}`);
        rm.textContent = '×';
        rm.addEventListener('click', () => {
          localStorage.setItem(STORE, JSON.stringify(saved().filter((s) => s.name !== v.name)));
          renderVersions();
        });
        row.append(rm);
      }
      $('versions').append(row);
    };
    builtIn.forEach((v) => add(v, false));
    saved().forEach((v) => add(v, true));
    markVersion(activeVersion);
  };

  $('save').addEventListener('click', () => {
    const name = prompt('Name this version', `Version ${saved().length + 1}`);
    if (!name) return;
    const list = saved().filter((s) => s.name !== name);
    list.push({ name, ...current() });
    localStorage.setItem(STORE, JSON.stringify(list));
    activeVersion = name;
    renderVersions();
    console.log('Saved version', JSON.stringify({ name, ...current() }));
  });

  // touching a slider means you're off the saved version
  sliders.forEach((k) => $(k).addEventListener('input', () => markVersion(null)));

  renderVersions();
  apply(builtIn[2]);

  // ?poster: the poster alone, with arrows (and the arrow keys) to step through the 20 grounds
  if (new URLSearchParams(location.search).has('poster')) {
    document.body.classList.add('poster-only');
    const chev = (d) => `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="${d}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const bar = document.createElement('div');
    bar.className = 'cycle';
    bar.innerHTML = `<button type="button" class="arrow" data-d="-1" aria-label="Previous ground">${chev('M10 3.5 5.5 8l4.5 4.5')}</button><span class="name" aria-live="polite"></span><button type="button" class="arrow" data-d="1" aria-label="Next ground">${chev('M6 3.5 10.5 8 6 12.5')}</button>`;
    document.body.append(bar);
    const name = bar.querySelector('.name');
    let i = Math.max(0, grounds.findIndex((g) => g[1] === ground));
    const go = (d) => {
      i = (i + d + grounds.length) % grounds.length;
      pick(grounds[i][1]);
      name.textContent = grounds[i][0];
    };
    bar.querySelectorAll('.arrow').forEach((b) => b.addEventListener('click', () => go(+b.dataset.d)));
    addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); });
    name.textContent = grounds[i][0];
  }

  // start from still and ease up to speed, instead of starting mid-motion
  const rampIn = (ms = 2500) => {
    if (!playing) return;
    const start = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - start) / ms);
      const eased = k * k * (3 - 2 * k);
      if (playing) mount.setSpeed(+$('speed').value * eased);
      if (k < 1 && playing) requestAnimationFrame(step);
    };
    mount.setSpeed(0);
    requestAnimationFrame(step);
  };
  rampIn();

  // Hook for recording a video: step the shader clock frame by frame. WebGL, so html-recording can't capture it.
  window.saetiaPoster = {
    mount,
    speed: () => +$('speed').value,
    // setLoop(seconds of video): makes the motion repeat exactly over that many seconds at the current speed
    setLoop: (videoSeconds, easeAmount = 0.75) => {
      loop = videoSeconds ? videoSeconds * +$('speed').value : 0;
      ease = loop ? easeAmount : 0;
      mount.setUniforms(uniforms());
      return loop;
    },
  };
</script>
</body>
</html>
