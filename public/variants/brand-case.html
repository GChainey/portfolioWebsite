<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gareth Chainey — Case study</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&family=Plus+Jakarta+Sans:wght@400..800&family=Jost:wght@300..600&display=swap" rel="stylesheet" />
<style>
/* A case study in the Brand variant: the whole page wears the brand of the company the work was for */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--c-bg); color: var(--c-ink); font-family: var(--c-body); font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
.pad { padding-left: 40px; padding-right: 40px; }
@media (max-width: 720px) { .pad { padding-left: 18px; padding-right: 18px; } body { font-size: 16px; } }

/* ============================================================ BRANDS */
/* SEEK: pink, navy, tight Jakarta, the dotted mark as a giant watermark */
[data-co="seek"] {
  --c-bg: #FFFFFF; --c-ink: #0D3880; --c-muted: #5B6C8F; --c-line: #DCE3F0; --c-surface: #F3F6FB; --c-accent: #E60278; --c-accent-ink: #FFFFFF;
  --c-band: #0D3880; --c-band-ink: #FFFFFF; --c-band-muted: #B9C8E6; --c-band-pop: #FF7DBD; --c-media: #000000; --c-r: 14px;
  --c-display: 'Plus Jakarta Sans', sans-serif; --c-weight: 800; --c-track: -.045em; --c-lead: 1; --c-body: 'Plus Jakarta Sans', sans-serif; --c-label: 'Plus Jakarta Sans', sans-serif; --c-bullet: '●';
  --cp-bg: #E60278; --cp-ink: #FFFFFF; --cp-muted: #FFE0EF; --cp-line: rgba(255,255,255,.35); --cp-mark-ink: #0D3880; --cp-size: clamp(46px, min(8.4vw, 14vh), 150px); --cp-logo-h: 44px;
}
/* Best Practice: deep navy to teal, light geometric Jost, soft glass bubbles */
[data-co="bp"] {
  --c-bg: #F3F8F9; --c-ink: #123A57; --c-muted: #55707F; --c-line: #D3E3E7; --c-surface: #FFFFFF; --c-accent: #2B7C84; --c-accent-ink: #FFFFFF;
  --c-band: linear-gradient(160deg, #123A57 0%, #1D5670 50%, #3E8A8F 100%); --c-band-ink: #FFFFFF; --c-band-muted: #C3DCE2; --c-band-pop: #7FD4DC; --c-media: #F4F4F4; --c-r: 22px;
  --c-display: 'Jost', 'Futura', sans-serif; --c-weight: 400; --c-track: -.015em; --c-lead: 1.04; --c-body: 'Jost', 'Futura', sans-serif; --c-label: 'Jost', sans-serif; --c-bullet: '✓';
  --cp-bg: linear-gradient(160deg, #123A57 0%, #1D5670 50%, #3E8A8F 100%); --cp-ink: #FFFFFF; --cp-muted: #C3DCE2; --cp-line: rgba(255,255,255,.25); --cp-mark-ink: #7FD4DC; --cp-size: clamp(40px, min(6.6vw, 11.5vh), 116px); --cp-logo-h: 46px;
}
[data-co="bp"] body, body[data-co="bp"] { font-size: 19px; }

.label { font-family: var(--c-label); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; line-height: 1.3; }
.disp { font-family: var(--c-display); font-weight: var(--c-weight); letter-spacing: var(--c-track); line-height: var(--c-lead); }

/* ============================================================ NAV */
.nav { position: fixed; inset: 0 0 auto 0; z-index: 50; height: 64px; display: flex; align-items: center; gap: 22px; color: #fff; mix-blend-mode: normal; transition: background .4s, color .4s, border-color .4s, transform .4s cubic-bezier(.2,.7,.2,1); border-bottom: 1px solid transparent; }
.nav.solid { background: color-mix(in srgb, var(--c-bg) 90%, transparent); color: var(--c-ink); border-bottom-color: var(--c-line); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); }
.nav.hide { transform: translateY(-100%); }
.nav a { text-decoration: none; font-weight: 600; font-size: 14px; }
.nav .home { display: flex; align-items: center; gap: 12px; }
.nav .mono-mark { display: grid; width: 32px; height: 32px; background: currentColor; place-items: center; border-radius: 8px; }
.nav .mono-mark b { font: 800 13px 'Inter', sans-serif; color: var(--cp-bg-solid, #111); mix-blend-mode: normal; }
.nav.solid .mono-mark b { color: var(--c-bg); }
.nav .sp { margin-left: auto; }
.nav .pill { height: 38px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 999px; box-shadow: inset 0 0 0 1.5px currentColor; }
@media (max-width: 720px) { .nav .hide-s { display: none; } }

/* ============================================================ HERO: the career panel, grown to a full page */
.cp { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; isolation: isolate; background: var(--cp-bg); color: var(--cp-ink); }
.cp-in { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding-top: 92px; padding-bottom: 44px; }
.cp-top { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--cp-line); }
.cp-logo .lg { height: var(--cp-logo-h); width: auto; display: block; }
.cp-logo .mk { fill: #FFFFFF; }
.cp-meta { font-family: var(--c-label); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--cp-muted); text-align: right; }
.cp-h .ln { display: block; }
.cp-h { align-self: center; margin: 40px 0; font-family: var(--c-display); font-weight: var(--c-weight); letter-spacing: var(--c-track); line-height: .98; font-size: var(--cp-size); }
[data-co="bp"] .cp-h { line-height: 1.02; }
.cp-h mark { background: transparent; color: var(--cp-mark-ink); }
[data-co="bp"] .cp-h mark { font-weight: 500; }
.cp-h .w { display: inline-block; opacity: 0; transform: translateY(.35em); transition: opacity .7s, transform .9s cubic-bezier(.16,1,.3,1); }
.cp.in .cp-h .w { opacity: 1; transform: none; }
.cp-grid { display: grid; grid-template-columns: 1.2fr 1.2fr 1.6fr; gap: 40px; align-items: end; padding-top: 24px; border-top: 1px solid var(--cp-line); }
.cp-role b { display: block; font-size: 20px; font-weight: 700; }
.cp-role .where { display: block; margin-top: 4px; font-family: var(--c-label); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--cp-muted); }
.cp-role p { margin: 14px 0 0; color: var(--cp-muted); font-size: 16px; line-height: 1.5; max-width: 400px; }
.cp-hl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 16px; line-height: 1.45; }
.cp-hl li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; }
.cp-hl li::before { content: var(--c-bullet); color: var(--cp-mark-ink); font-weight: 700; }
[data-co="seek"] .cp-hl li::before { color: #FFFFFF; font-size: .7em; padding-top: .35em; }
.cp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.cp-stat b { display: block; font-family: var(--c-display); font-weight: var(--c-weight); font-size: clamp(26px, 3vw, 50px); line-height: 1; letter-spacing: var(--c-track); white-space: nowrap; }
.cp-stat span { display: block; margin-top: 6px; font-size: 13px; line-height: 1.35; color: var(--cp-muted); }
[data-co="seek"] .cp-stat { border-left: 4px solid #FFFFFF; padding-left: 14px; }
[data-co="bp"] .cp-stat { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(10px); border-radius: 18px; padding: 14px 16px; }
.cp-deco { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
[data-co="seek"] .cp-deco svg { position: absolute; right: -9vw; top: -12vw; width: 44vw; max-width: 720px; opacity: .16; color: #FFFFFF; }
[data-co="bp"] .cp-deco i, [data-co="bp"] .band-deco i { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), rgba(255,255,255,.04) 60%, transparent 70%); filter: blur(1px); }
@media (max-width: 980px) { .cp-grid { grid-template-columns: 1fr; gap: 26px; } .cp-stats { grid-template-columns: 1fr; } }

/* ============================================================ CHAPTERS */
.ch { border-top: 1px solid var(--c-line); padding-top: 96px; padding-bottom: 96px; }
.ch-head { display: grid; grid-template-columns: 120px 1fr; gap: 24px; align-items: baseline; margin-bottom: 48px; }
.ch-n { color: var(--c-accent); font-family: var(--c-display); font-weight: var(--c-weight); font-size: clamp(22px, 2vw, 30px); letter-spacing: var(--c-track); }
.ch-t { margin: 0; font-size: clamp(38px, 5.4vw, 92px); max-width: 16ch; }
[data-co="bp"] .ch-t { max-width: 20ch; }
.ch-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 64px; align-items: start; padding-left: 144px; }
.ch-body.solo { grid-template-columns: minmax(0, 760px); }
.ch-text { position: sticky; top: 96px; }
.ch-text p { margin: 0 0 18px; color: var(--c-muted); }
.ch-text p.lead { color: var(--c-ink); font-size: 1.18em; line-height: 1.45; }
.ch-text h4 { margin: 34px 0 10px; font-family: var(--c-display); font-weight: var(--c-weight); letter-spacing: var(--c-track); font-size: 26px; line-height: 1.1; }
[data-co="bp"] .ch-text h4 { font-weight: 500; }
.ch-text ul { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }
.ch-text li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
.ch-text li::before { content: var(--c-bullet); color: var(--c-accent); font-weight: 700; }
[data-co="seek"] .ch-text li::before { font-size: .6em; padding-top: .7em; }
.ch-media { display: grid; gap: 28px; min-width: 0; }
/* a chapter with no text: the images carry it, two across */
.ch-media.grid2 { grid-template-columns: 1fr 1fr; align-items: start; }
.ch-media.grid2 .span { grid-column: 1 / -1; }
@media (max-width: 720px) { .ch-media.grid2 { grid-template-columns: 1fr; } }
@media (max-width: 1000px) { .ch-head { grid-template-columns: 1fr; gap: 8px; } .ch-body { grid-template-columns: 1fr; gap: 32px; padding-left: 0; } .ch-text { position: static; } .ch { padding-top: 64px; padding-bottom: 64px; } }

figure.m { margin: 0; min-width: 0; }
figure.m .fr { border-radius: var(--c-r); overflow: hidden; background: var(--c-media); border: 1px solid var(--c-line); }
[data-co="seek"] figure.m .fr { border-color: #0D3880; box-shadow: 10px 10px 0 var(--c-accent); }
[data-co="bp"] figure.m .fr { box-shadow: 0 30px 60px -34px rgba(18,58,87,.45); }
figure.m img, figure.m video { display: block; width: 100%; height: auto; }
figure.m figcaption { margin-top: 14px; display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--c-muted); }
figure.m figcaption b { flex: none; font-family: var(--c-label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-accent-ink); background: var(--c-accent); padding: 3px 8px; border-radius: 999px; }
[data-co="seek"] figure.m { padding-right: 10px; padding-bottom: 10px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 720px) { .duo { grid-template-columns: 1fr; } }

/* cards: goals, lessons, findings */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--c-r); padding: 24px; }
.card b { display: block; font-family: var(--c-display); font-weight: var(--c-weight); letter-spacing: var(--c-track); font-size: 24px; line-height: 1.12; margin-bottom: 10px; }
[data-co="bp"] .card b { font-weight: 500; }
.card p { margin: 0; color: var(--c-muted); font-size: 16px; line-height: 1.5; }
.card .k { display: inline-grid; place-items: center; width: 34px; height: 34px; margin-bottom: 16px; border-radius: 50%; background: var(--c-accent); color: var(--c-accent-ink); font-weight: 700; font-size: 15px; }
[data-co="seek"] .card { border-color: #0D3880; border-width: 1.5px; }
@media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }

/* outcome table: goal against result */
.gv { display: grid; gap: 0; border-top: 1.5px solid var(--c-ink); }
.gv-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; align-items: baseline; padding: 22px 0; border-bottom: 1px solid var(--c-line); }
.gv-row .what { color: var(--c-muted); }
.gv-row .goal b, .gv-row .got b { display: block; font-family: var(--c-display); font-weight: var(--c-weight); letter-spacing: var(--c-track); line-height: 1; }
.gv-row .goal b { font-size: clamp(22px, 2.4vw, 36px); opacity: .45; }
.gv-row .got b { font-size: clamp(34px, 4.4vw, 68px); color: var(--c-accent); }
.gv-row span { font-family: var(--c-label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-muted); }
@media (max-width: 720px) { .gv-row { grid-template-columns: 1fr 1fr; } .gv-row .what { grid-column: 1 / -1; } }

/* ============================================================ BANDS: full-bleed moments */
.band { position: relative; overflow: hidden; isolation: isolate; background: var(--c-band); color: var(--c-band-ink); padding-top: 120px; padding-bottom: 120px; }
.band.hot { background: var(--cp-bg); }
.band-deco { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.band-t { margin: 0; font-size: clamp(64px, 13vw, 240px); line-height: .9; }
[data-co="bp"] .band-t { font-size: clamp(48px, 8.6vw, 150px); line-height: 1; max-width: 14ch; }
.band-t mark { background: transparent; color: var(--c-band-pop); }
.band.hot .band-t mark { color: var(--cp-mark-ink); }
.band p { margin: 28px 0 0; max-width: 620px; font-size: 22px; line-height: 1.4; color: var(--c-band-muted); }
.band.hot p { color: var(--cp-muted); }
.band-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.band-stats b { display: block; font-family: var(--c-display); font-weight: var(--c-weight); letter-spacing: var(--c-track); font-size: clamp(56px, 8.6vw, 150px); line-height: .92; }
.band-stats b i { font-style: normal; color: var(--c-band-pop); }
.band-stats span { display: block; margin-top: 14px; color: var(--c-band-muted); max-width: 26ch; }
@media (max-width: 800px) { .band-stats { grid-template-columns: 1fr; gap: 32px; } .band { padding-top: 80px; padding-bottom: 80px; } }

/* ============================================================ FUNNEL */
.funnel { display: grid; gap: 6px; }
.fn-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; align-items: center; }
.fn-bar { height: 76px; display: grid; place-items: center; text-align: center; padding: 0 12%; font-weight: 700; font-size: 16px; background: color-mix(in srgb, var(--c-ink) 10%, var(--c-bg)); color: var(--c-ink); clip-path: polygon(var(--a) 0, calc(100% - var(--a)) 0, calc(100% - var(--b)) 100%, var(--b) 100%); transform: scaleX(.6); opacity: 0; transition: transform .8s cubic-bezier(.16,1,.3,1), opacity .5s; }
.funnel.in .fn-bar { transform: none; opacity: 1; }
.fn-bar.leak { background: var(--c-accent); color: var(--c-accent-ink); }
.fn-why { opacity: 0; transform: translateX(-14px); transition: opacity .6s .5s, transform .7s .5s cubic-bezier(.16,1,.3,1); }
.funnel.in .fn-why { opacity: 1; transform: none; }
.fn-why span { display: block; font-family: var(--c-label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-accent); margin-bottom: 4px; }
.fn-why b { font-size: 19px; line-height: 1.25; }
@media (max-width: 720px) { .fn-row { grid-template-columns: 1fr; gap: 6px; } .fn-why { padding-bottom: 12px; } }

/* ============================================================ NEXT */
.next { display: block; text-decoration: none; position: relative; overflow: hidden; isolation: isolate; padding-top: 110px; padding-bottom: 110px; background: var(--cp-bg); color: var(--cp-ink); }
.next .label { color: var(--cp-muted); }
.next .t { display: block; margin-top: 18px; font-family: var(--c-display); font-weight: var(--c-weight); letter-spacing: var(--c-track); line-height: .98; font-size: clamp(44px, 7.4vw, 128px); max-width: 16ch; transition: transform .6s cubic-bezier(.16,1,.3,1); }
.next:hover .t { transform: translateX(18px); }
.next .lg { height: 40px; width: auto; display: block; margin-bottom: 34px; }
.next .mk { fill: #FFFFFF; }
.foot { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-top: 26px; padding-bottom: 26px; font-size: 14px; color: var(--c-muted); background: var(--c-bg); }
.foot a { text-underline-offset: 4px; }

.reveal { opacity: 0; transform: translateY(36px); transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal, .cp-h .w, .fn-bar, .fn-why { opacity: 1 !important; transform: none !important; } }
</style>
</head>

</nav>

let n = 0
const block = b => {
  if (b.band) return `<section class="band ${b.band} pad"><div class="band-deco" aria-hidden="true">${key === 'bp' ? bubbles : ''}</div><h2 class="band-t disp reveal">${b.t}</h2><p class="reveal">${b.p}</p></section>`
  if (b.bandStats) return `<section class="band pad"><div class="band-deco" aria-hidden="true">${key === 'bp' ? bubbles : ''}</div><div class="band-stats">${b.bandStats.map(([v, l]) => `<div class="reveal"><b>${v}</b><span>${l}</span></div>`).join('')}</div></section>`
  n++
  const right = [
    b.funnel ? `<div class="funnel reveal">${b.funnel.map(([l, why], i, a) => `<div class="fn-row"><div class="fn-bar${why ? ' leak' : ''}" style="--a:${i * 8}%;--b:${(i + 1) * 8}%;transition-delay:${i * 90}ms">${l}</div><div class="fn-why">${why ? `<span>Assumption</span><b>${why}</b>` : ''}</div></div>`).join('')}</div>` : '',
    b.gv ? `<div class="gv reveal">${b.gv.map(([w, g, o]) => `<div class="gv-row"><div class="what">${w}</div><div class="goal">${g ? `<span>${/→|\+/.test(g) ? 'Goal' : 'Was'}</span><b>${g}</b>` : ''}</div><div class="got"><span>Outcome</span><b>${o}</b></div></div>`).join('')}</div>` : '',
    ...(b.media || []).map(fig),
  ].join('')
  const cards = b.cards ? `<div class="cards">${b.cards.map(([t, p], i) => `<div class="card reveal" style="transition-delay:${i * 80}ms"><span class="k">${key === 'bp' ? '✓' : i + 1}</span><b>${t}</b><p>${p}</p></div>`).join('')}</div>` : ''
  return `<section class="ch pad">
    <div class="ch-head reveal"><span class="ch-n">${String(n).padStart(2, '0')}</span><div>${b.kicker ? `<span class="label" style="color:var(--c-accent)">${b.kicker}</span>` : ''}<h2 class="ch-t disp">${b.ch}</h2></div></div>
    ${cards ? `<div class="ch-body solo" style="grid-template-columns:1fr">${cards}${b.after ? `<div class="ch-text" style="position:static;max-width:760px;margin-top:36px">${text(b.after)}</div>` : ''}</div>`
      : !b.text ? `<div class="ch-body solo" style="grid-template-columns:1fr"><div class="ch-media grid2">${right}</div></div>`
      : `<div class="ch-body${right ? '' : ' solo'}"><div class="ch-text reveal">${text(b.text)}</div>${right ? `<div class="ch-media">${right}</div>` : ''}</div>`}
  </section>`
}

document.getElementById('app').innerHTML = `
<header class="cp" id="top">
  <div class="cp-deco" aria-hidden="true">${deco(key)}</div>
  <div class="cp-in pad">
    <div class="cp-top"><span class="cp-logo">${LOGOS[key]}</span><span class="cp-meta">${C.meta}</span></div>
    <h1 class="cp-h">${C.h.map(l => `<span class="ln">${words(l)}</span>`).join(' ')}</h1>
    <div class="cp-grid">
      <div class="cp-role"><b>${C.role}</b><span class="where">${C.where}</span><p>${C.about}</p></div>
      <ul class="cp-hl">${C.hl.map(h => `<li>${h}</li>`).join('')}</ul>
      <div class="cp-stats">${C.stats.map(([v, l]) => `<div class="cp-stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    </div>
  </div>
</header>
<main>${C.blocks.map(block).join('')}</main>
<a class="next pad" data-co="${C.next}" href="/variants/brand/${C.next === 'bp' ? 'best-practice' : 'seek'}">
  <div class="cp-deco" aria-hidden="true">${deco(C.next)}</div>
  ${LOGOS[C.next]}
  <span class="label">Next case study</span>
  <span class="t">${N.title} →</span>
</a>
<footer class="foot pad"><span>Gareth Chainey · Brand variant</span><span><a href="/variants/brand">Brand home</a> · <a href="${C.std}">Standard version</a> · <a href="/variants">All variants</a></span></footer>`

/* ---------------------------------------------------------- motion */
const cp = document.querySelector('.cp')
cp.querySelectorAll('.cp-h .w').forEach((w, k) => w.style.transitionDelay = (k * 45) + 'ms')
requestAnimationFrame(() => cp.classList.add('in'))
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .12, rootMargin: '0px 0px -6% 0px' })
document.querySelectorAll('.reveal').forEach(el => io.observe(el))
// videos only play while they are on screen
const vio = new IntersectionObserver(es => es.forEach(e => { e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause() }), { threshold: .35 })
document.querySelectorAll('video').forEach(v => vio.observe(v))
// nav: clear over the hero, solid after it, hidden on the way down
const nav = document.getElementById('nav')
let lastY = 0
addEventListener('scroll', () => {
  const y = scrollY
  nav.classList.toggle('solid', y > 40)
  nav.classList.toggle('hide', y > lastY && y > 80)
  lastY = y
}, { passive: true })
})()
</script>
</body>
</html>
